<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SMS Gateway</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --panel2: #222c37; --line: #2c3947;
    --text: #e6edf3; --muted: #8b98a5; --accent: #2f81f7; --accent-h: #4a93ff;
    --ok: #2ea043; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .who { color: var(--muted); font-size: 13px; }
  header button { margin-left: 12px; }
  main { max-width: 960px; margin: 0 auto; padding: 22px; }
  .grid { display: grid; gap: 18px; }
  @media (min-width: 760px) { .cols { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .card h2 { margin: 0 0 14px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 5px; }
  input, textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 10px 12px; font: inherit; margin-bottom: 14px;
  }
  textarea { resize: vertical; min-height: 90px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 7px;
    padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-h); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 500; }
  button.ghost:hover { background: var(--panel2); }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat { background: var(--panel2); border-radius: 8px; padding: 14px; }
  .stat .n { font-size: 26px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td.msg { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.queued { background: rgba(210,153,34,.15); color: var(--warn); }
  .pill.sent   { background: rgba(46,160,67,.15);  color: var(--ok); }
  .pill.failed { background: rgba(248,81,73,.15);  color: var(--err); }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--line); padding: 12px 18px;
    border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .toast.ok { border-color: var(--ok); }
  .toast.err { border-color: var(--err); }
  /* login overlay */
  #login {
    position: fixed; inset: 0; background: var(--bg); display: flex;
    align-items: center; justify-content: center; z-index: 10;
  }
  #login .card { width: 340px; max-width: 92vw; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h2>SMS Gateway — Sign in</h2>
    <form id="loginForm">
      <label>Username</label>
      <input id="lu" autocomplete="username" required />
      <label>Password</label>
      <input id="lp" type="password" autocomplete="current-password" required />
      <button type="submit" style="width:100%">Connect</button>
      <p id="loginErr" class="muted" style="color:var(--err)"></p>
    </form>
    <p class="muted">Uses the SERVER_USERNAME / SERVER_PASSWORD from your <code>.env</code>.</p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1>📱 SMS Gateway</h1>
    <div>
      <span class="who" id="who"></span>
      <button class="ghost" id="logout">Sign out</button>
    </div>
  </header>

  <main class="grid">
    <div class="card">
      <h2>Status</h2>
      <div class="stats">
        <div class="stat"><div class="n" id="sQueue">–</div><div class="l">In queue</div></div>
        <div class="stat"><div class="n" id="sToday">–</div><div class="l">Sent today</div></div>
        <div class="stat"><div class="n" id="sQuota">–</div><div class="l">Remaining quota</div></div>
        <div class="stat"><div class="n" id="sInterval">–</div><div class="l">Min interval (s)</div></div>
      </div>
    </div>

    <div class="card">
      <h2>Send a message</h2>
      <form id="sendForm">
        <label>Recipient (E.164, e.g. +15551234567)</label>
        <input id="recipient" placeholder="+15551234567" required />
        <label>Message</label>
        <textarea id="message" placeholder="Your message…" required></textarea>
        <button type="submit" id="sendBtn">Queue &amp; send</button>
      </form>
    </div>

    <div class="card" style="grid-column: 1 / -1">
      <div class="row">
        <h2 style="margin:0">Recent messages</h2>
        <button class="ghost" id="refresh">Refresh</button>
      </div>
      <table>
        <thead>
          <tr><th>#</th><th>Recipient</th><th>Message</th><th>Status</th><th>Attempts</th><th>Created</th><th>Error</th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="7" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let auth = sessionStorage.getItem("sms_auth") || "";

function toast(msg, kind) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + (kind || "");
  setTimeout(() => { t.className = "toast"; }, 3200);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Authorization": "Basic " + auth, "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  if (res.status === 401) { signOut(); throw new Error("Unauthorized"); }
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function fmtTime(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleString(); } catch (e) { return iso; }
}

async function loadStatus() {
  try {
    const s = await api("/status");
    $("sQueue").textContent = s.queue_length;
    $("sToday").textContent = s.sent_today;
    $("sQuota").textContent = s.remaining_daily_quota + " / " + s.daily_limit;
    $("sInterval").textContent = s.min_interval_seconds;
  } catch (e) { /* handled by api() / signOut */ }
}

async function loadMessages() {
  try {
    const msgs = await api("/messages?limit=50");
    const rows = $("rows");
    if (!msgs.length) { rows.innerHTML = '<tr><td colspan="7" class="muted">No messages yet.</td></tr>'; return; }
    rows.innerHTML = msgs.map(m => `
      <tr>
        <td>${m.id}</td>
        <td>${escapeHtml(m.recipient)}</td>
        <td class="msg" title="${escapeHtml(m.body)}">${escapeHtml(m.body)}</td>
        <td><span class="pill ${m.status}">${m.status}</span></td>
        <td>${m.attempts}</td>
        <td>${fmtTime(m.created_at)}</td>
        <td class="msg muted" title="${escapeHtml(m.error || "")}">${escapeHtml(m.error || "")}</td>
      </tr>`).join("");
  } catch (e) { /* handled */ }
}

function refreshAll() { loadStatus(); loadMessages(); }

// --- send ---
$("sendForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("sendBtn");
  btn.disabled = true;
  try {
    const data = await api("/send", {
      method: "POST",
      body: JSON.stringify({ recipient: $("recipient").value.trim(), message: $("message").value }),
    });
    toast(`Queued message #${data.id} (queue: ${data.queue_position})`, "ok");
    $("message").value = "";
    refreshAll();
  } catch (e) {
    toast("Send failed: " + e.message, "err");
  } finally {
    btn.disabled = false;
  }
});

// --- login / logout ---
function showApp(username) {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("who").textContent = username ? "Signed in as " + username : "";
  refreshAll();
}

function signOut() {
  auth = "";
  sessionStorage.removeItem("sms_auth");
  sessionStorage.removeItem("sms_user");
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}

$("logout").addEventListener("click", signOut);

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const u = $("lu").value, p = $("lp").value;
  auth = btoa(u + ":" + p);
  try {
    await api("/status");                       // validates the credentials
    sessionStorage.setItem("sms_auth", auth);
    sessionStorage.setItem("sms_user", u);
    $("loginErr").textContent = "";
    showApp(u);
  } catch (err) {
    auth = "";
    $("loginErr").textContent = "Invalid username or password.";
  }
});

// auto-refresh every 5s while signed in
setInterval(() => { if (auth && !$("app").classList.contains("hidden")) refreshAll(); }, 5000);
$("refresh").addEventListener("click", refreshAll);

// resume session if we already have creds
if (auth) {
  api("/status").then(() => showApp(sessionStorage.getItem("sms_user") || "")).catch(() => signOut());
}
</script>
</body>
</html>
